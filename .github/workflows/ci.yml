name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Check generated Worker types
        run: npm run cf:types && npx wrangler types --check
      - name: Type check
        run: npm run check
      - name: Workflow tests
        run: npm test
      - name: Build
        run: npm run build
