<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>息间 · 10 个全新设计方向</title><link rel="stylesheet" href="/ui-directions.css"><script src="/design-assets/icons.js" defer></script><script src="/ui-directions.js" defer></script></head>
<body>
  <header class="lab-header"><a href="/admin" class="lab-brand">息间 <span>设计实验室 / 第二轮</span></a><a href="/ui-options.html">查看原来的 30 套 ↗</a></header>
  <main class="lab">
    <section class="lab-intro"><div><p>10 个设计方向</p><h1>这一次，从结构开始。</h1><p>报刊、桌面小组件、海报、禅意、复古系统、看板、手帐、线路图、日程、聊天。<br>相同的三项任务，十种不同的打开方式。</p></div><a href="#directions">浏览全部方案 ↓</a></section>
    <section class="viewer" aria-label="完整设计预览">
      <header class="viewer-header"><div><span id="number"></span><h2 id="name"></h2></div><button id="pick">选择这个方向</button></header>
      <div class="viewer-description"><p id="description"></p><span id="traits"></span></div>
      <div class="viewer-tools"><div><button data-device="desktop" aria-pressed="true">桌面视图</button><button data-device="mobile" aria-pressed="false">手机视图</button></div><p>可体验打卡与添加图片 · 示例数据</p><div><button id="prev" aria-label="上一个方向">←</button><button id="next" aria-label="下一个方向">→</button></div></div>
      <div id="stage" class="stage"><div id="preview" class="scene"></div></div>
      <p id="choice" class="choice" role="status" hidden></p>
    </section>
    <section id="directions" class="directions"><header><h2>先看十种气质，再挑一个。</h2><span>每个方向使用独立页面结构</span></header><div id="gallery" class="gallery"></div></section>
    <footer class="lab-footer">本轮为独立的 UI 选型页。原来的 30 套方案与项目界面均保留。<br>插画：<a href="https://www.opendoodles.com/" target="_blank" rel="noopener">Open Doodles</a> / <a href="https://www.openpeeps.com/" target="_blank" rel="noopener">Open Peeps</a> · 图标：<a href="https://phosphoricons.com/" target="_blank" rel="noopener">Phosphor</a></footer>
  </main>
</body></html>
